<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 100vh;
      font-family: monospace;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .topbar h1 {
      color: #fff;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: normal;
    }
    .switch-btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 1px;
      transition: background 0.15s, color 0.15s;
    }
    .switch-btn:hover {
      background: #fff;
      color: #000;
    }
    canvas {
      display: block;
      border: 1px solid #222;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>ASTEROIDS</h1>
    <a class="switch-btn" href="index-3d.html">JUGAR VERSIÓN 3D →</a>
  </div>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script src="game.js"></script>
</body>
</html>
